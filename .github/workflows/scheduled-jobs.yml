name: scheduled-jobs

# Background jobs for the Content Performance Tracker. The Vercel account is on
# the Hobby plan, where a cron in vercel.json can only run once per day (a more
# frequent expression fails the deployment). So the ads / reporting syncs are
# driven from here instead, hitting the /api/jobs/** route handlers with the
# same Authorization: Bearer <CRON_SECRET> header Vercel Cron would send.
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   APP_URL      https://claude-code-02-thang20.vercel.app   (no trailing slash)
#   CRON_SECRET  same value as the Vercel env var

on:
  schedule:
    - cron: "7 * * * *" # ads-sync      (hourly; the job itself decides per-item due-ness / cadence)
    - cron: "13 3 * * *" # meta-token-refresh (daily)
    - cron: "23 */2 * * *" # reporting-campaign-sync (every 2h; design.md Decision 4 ~1–3h/account)
    - cron: "43 */2 * * *" # reporting-ad-sync       (every 2h, offset)
    - cron: "31 2 * * *" # members-reconcile (daily; Team Activity Calendar — mirror users → members)
    - cron: "*/5 * * * *" # calendar-reminders-send  (Mục C §5 wants 1 min; ~5 is the floor here)
    - cron: "2,17,32,47 * * * *" # calendar-reminders-expand (recurring items, next 36h; every 15 min)
    - cron: "17 3 * * *" # calendar-cleanup (daily; purge 30-day soft-deletes + spent reminders)
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now
        required: true
        type: choice
        options:
          - ads-sync
          - meta-token-refresh
          - reporting-campaign-sync
          - reporting-ad-sync
          - members-reconcile
          - calendar-reminders-send
          - calendar-reminders-expand
          - calendar-cleanup

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve which job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "7 * * * *")     job=ads-sync ;;
            "13 3 * * *")    job=meta-token-refresh ;;
            "23 */2 * * *")  job=reporting-campaign-sync ;;
            "43 */2 * * *")  job=reporting-ad-sync ;;
            "31 2 * * *")    job=members-reconcile ;;
            "*/5 * * * *")   job=calendar-reminders-send ;;
            "2,17,32,47 * * * *") job=calendar-reminders-expand ;;
            "17 3 * * *")    job=calendar-cleanup ;;
            "")              job="${{ github.event.inputs.job }}" ;;
            *) echo "::error::unrecognised schedule '${{ github.event.schedule }}'"; exit 1 ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"

      - name: Trigger ${{ steps.pick.outputs.job }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL / CRON_SECRET repo secrets are not set"
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 300 \
            -X POST "$APP_URL/api/jobs/$JOB" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat response.json || true
          echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
